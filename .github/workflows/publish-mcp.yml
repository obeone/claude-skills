name: Publish gemini-tts-mcp to PyPI
on:
  workflow_dispatch:
permissions:
  id-token: write    # trusted publishing (OIDC) — primary
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build the MCP package
        working-directory: skills/tts-duet/mcp
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: skills/tts-duet/mcp/dist
          # Trusted publishing (OIDC) is primary — no token needed if the
          # PyPI project has a trusted publisher for this repo/workflow.
          # Token fallback: set `password: ${{ secrets.PYPI_API_TOKEN }}`
          # (repo/environment secret) and remove `id-token: write`.
