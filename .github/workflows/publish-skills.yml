name: Publish Skills

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build skill packages
        uses: NimbleBrainInc/skill-pack@v1
        with:
          directory: ./skills
          build: true
          upload: false
          announce: false

      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rename to stable names and upload
        run: |
          for skill in skills/**/*.skill; do
            # Rename: name-1.0.0.skill -> name.skill
            dir=$(dirname "$skill")
            base=$(basename "$skill")
            stable_name=$(echo "$base" | sed 's/-[0-9]*\.[0-9]*\.[0-9]*\.skill$/.skill/')
            mv "$skill" "$dir/$stable_name"
          done
          # Upload only stable-named files
          gh release upload "${{ github.ref_name }}" skills/**/*.skill --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Announce skills
        uses: NimbleBrainInc/skill-pack@v1
        with:
          directory: ./skills
          build: false
          upload: false
          announce: true
