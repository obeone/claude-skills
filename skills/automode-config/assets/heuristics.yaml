# automode-config heuristics catalog (flat YAML, no nesting, no lists).
# Parsed by scripts/_canonical.py:parse_flat_yaml. One key per line.
# Format: <key>: <value>. No empty values. No comments after a value.
# Lines beginning with "#" and blank lines are ignored.
#
# Each `signal_*` entry is a project-scan probe. When the probe matches,
# the skill surfaces a PROSE candidate the user can keep/edit/drop. The
# rationale describes which autoMode section it likely belongs to —
# `environment` for trust signals, `allow` for routine internal ops,
# `soft_deny` for project-specific destructive risks, `hard_deny` for
# unconditional boundaries. Candidates are NEVER tool patterns;
# autoMode rules are natural-language descriptions (see
# references/automode_doc_bible.md).

claude_code_version_range: ">=2.1.83,<3.0"

signal_dockerfile: A Dockerfile or Containerfile at the project root means container builds happen here. Surface as an `environment` candidate, e.g. "Container builds: Docker is used to build images for this project."
signal_compose: A compose.yaml/compose.yml/docker-compose.yaml at the project root means a local stack is part of the workflow. Surface as an `environment` candidate naming the stack.
signal_package_json: A package.json at the project root means Node tooling is used. Surface as an `environment` candidate (e.g. "Node tooling: package.json declares dev scripts that may run in test runs.") — never as a Bash() rule.
signal_pyproject: A pyproject.toml at the project root means Python project tooling. Surface as an `environment` candidate naming the package manager (uv/poetry/pip) and the typical dev commands.
signal_python_version: A .python-version file pins the interpreter. Surface in the prompt so the user can word the environment description with the matching version.
signal_makefile: A Makefile at the project root means make is used to drive builds. Surface as an `environment` candidate listing the declared targets that run in routine flows.
signal_helm: A Chart.yaml or charts/ directory means Helm is used. Surface as an `environment` candidate for read-only Helm operations and a `soft_deny` candidate for cluster-mutating operations like `helm install` and `helm upgrade`.
signal_kustomize: A kustomization.yaml means Kustomize is used. Surface as an `environment` candidate for read-only kubectl kustomize.
signal_terraform: A *.tf file or .terraform/ means Terraform is used. Surface as an `environment` candidate for plan/validate, and a `hard_deny` candidate for `terraform apply` outside an approved promotion path.
signal_node_modules_in_gitignore: node_modules listed in .gitignore confirms a JS project layout. Reinforces signal_package_json without being its prerequisite.
signal_pytest_ini: A pytest.ini, pyproject.toml [tool.pytest.ini_options], or tox.ini with [pytest] means pytest is used. Surface as an `environment` candidate naming the test runner.
signal_uv_lock: A uv.lock file confirms uv as the Python package manager. Surface as an `environment` candidate for "uv-driven Python project; routine dependency installs run via uv sync."
signal_pre_commit: A .pre-commit-config.yaml means pre-commit hooks are used. Surface as an `environment` candidate naming the hook runner.
signal_eslint: An .eslintrc.* or eslint.config.* means ESLint is used. Surface as an `environment` candidate naming the linter.
signal_tsconfig: A tsconfig.json means TypeScript is used. Surface as an `environment` candidate naming the build tool and any committed dist/ output.
signal_cargo: A Cargo.toml means Rust tooling is used. Surface as an `environment` candidate naming routine cargo subcommands.
signal_go_mod: A go.mod means Go tooling is used. Surface as an `environment` candidate naming routine go subcommands.
signal_pyright: A pyrightconfig.json means Python type-checking is in scope. Surface as an `environment` candidate naming the type-checker.
signal_ruff: A ruff.toml or [tool.ruff] in pyproject.toml means ruff is used. Surface as an `environment` candidate naming the linter.
signal_dotenv: A .env file at the project root indicates secrets. Surface a `hard_deny` candidate of the form "Never commit, transmit, or stage the contents of .env files" — env contents must never appear in autoMode rules verbatim.
