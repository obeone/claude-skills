# Voice catalog for the tts-duet skill.
#
# Only five voices are documentation-confirmed by Google (verified=true).
# The remaining 25 are labelled (to verify) / tonal_hint=unknown until an
# operator auditions them — see references/voices_catalog.md for the
# pre-tag audition checklist that must be fully ticked before shipping
# new voices as stable presets.
#
# Schema
# ------
# voices:
#   - name: <canonical capitalized name expected by the Gemini SDK>
#     descriptor: <one-word tonal description or "(to verify)">
#     tonal_hint: low | mid | high | unknown
#     verified: true | false
#
# The list is kept sorted alphabetically by `name` to keep diffs clean.
