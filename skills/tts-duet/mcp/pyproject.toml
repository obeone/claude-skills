[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-tts-mcp"
version = "0.1.0"
description = "Vendored MCP server exposing Gemini TTS + text tools for the tts-duet skill."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Grégoire Compagnon", email = "obeone@obeone.org" },
]
keywords = ["mcp", "gemini", "tts", "text-to-speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=0.9",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gemini-tts-mcp = "gemini_tts_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_tts_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
