# Voice preset catalog.
#
# Only `podcast-chill` is considered stable (both voices are documented
# by Google). The rest rely on voices whose tonal descriptors still need
# operator audition — `experimental: true` so the CLI prints a warning
# when they are selected.
presets:
  podcast-chill:
    intent: Warm + airy
    speaker_a: Charon
    speaker_b: Aoede
    experimental: false
  interview-pro:
    intent: Informative + measured
    speaker_a: Rasalgethi
    speaker_b: Callirrhoe
    experimental: true
  narration-duo:
    intent: Firm + bright
    speaker_a: Orus
    speaker_b: Autonoe
    experimental: true
  deep-warm:
    intent: Warm + low register
    speaker_a: Algieba
    speaker_b: Sulafat
    experimental: true
  mono-warm:
    intent: Solo warm
    speaker_a: Algieba
    speaker_b: null
    experimental: true
  mono-informative:
    intent: Solo narrator
    speaker_a: Rasalgethi
    speaker_b: null
    experimental: true
